name = "mediaflow-proxy-light"
main = "src/index.ts"
compatibility_date = "2024-11-15"
compatibility_flags = ["nodejs_compat"]

# Workers Premium (required for streaming response with range requests)
# https://developers.cloudflare.com/workers/platform/compatibility-table
# Use 'workers' plan for basic functionality, 'premium' for streaming

[vars]
SERVER_PORT = "8888"
PROXY_CONNECT_TIMEOUT = "30"
PROXY_BUFFER_SIZE = "262144"
PROXY_FOLLOW_REDIRECTS = "true"
HLS_PREBUFFER_SEGMENTS = "5"
HLS_SEGMENT_CACHE_TTL = "300"
EPG_CACHE_TTL = "3600"
LOG_LEVEL = "info"

[env.staging]
name = "mediaflow-light-staging"
vars = { ENVIRONMENT = "staging" }
# Static assets
[assets]
directory = "src/web_ui"
binding = "ASSETS"
run_worker_first = true
